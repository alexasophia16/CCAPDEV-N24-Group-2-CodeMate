<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book a consultation</title>
</head>

<body>
  <form class="modal" aria-labelledby="modal-title">
    <h2 id="modal-title" class="modal-title">Book a consultation</h2>
    <p class="modal-tutor">with Juan Miguel R.</p>

    <div class="field">
      <label for="subject">Subject</label>
      <select id="subject" name="subject">
        <option>Data Structures &amp; Algorithms</option>
        <option>Programming Fundamentals</option>
        <option>Discrete Mathematics</option>
        <option>Databases</option>
      </select>
    </div>

    <div class="field">
      <label for="datetime">Date &amp; time</label>
      <input type="datetime-local" id="datetime" name="datetime" />
    </div>

    <div class="field">
      <label for="mode">Mode</label>
      <select id="mode" name="mode">
        <option>Online</option>
        <option>In person</option>
      </select>
    </div>

    <div class="actions">
      <button type="button" class="btn btn-cancel">Cancel</button>
      <button type="submit" class="btn btn-confirm">Confirm booking</button>
    </div>
  </form>
</body>
</html>
