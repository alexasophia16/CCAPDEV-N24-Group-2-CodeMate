<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodeMate - Find a Tutor</title>

  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="sidebar.css">
  <link rel="stylesheet" href="topbar.css">
  <link rel="stylesheet" href="find-tutor.css">
</head>
<body>
  <header>
    <h1>CodeMate</h1>
    <nav>
      <ul>
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="find-tutor.html">Find a Tutor</a></li>
        <li><a href="my-bookings.html">My Bookings</a></li>
        <li><a href="discussions.html">Discussions</a></li>
        <li><a href="messages.html">Messages</a></li>
        <li><a href="login.html">Log out</a></li>
      </ul>
    </nav>

    <div class="sidebar-foot">CCDEVAP &middot; Group 2<br>CodeMate prototype</div>

  </aside>

  <div class="main-column">

    <header class="topbar">

      <button type="button" class="topbar-hamburger" id="topbar-hamburger" aria-label="Open menu">&#9776;</button>

      <form class="topbar-search" role="search" id="topbar-search-form">
        <span class="topbar-search-icon">&#8981;</span>
        <input type="search" id="global-search" name="q" placeholder="Search tutors, subjects, discussions...">
      </form>

      <div class="topbar-actions">

        <button type="button" class="icon-btn" id="btn-notifications" aria-label="Notifications">
          <span>&#128276;</span>
          <span class="icon-btn-badge" id="notifications-badge" hidden></span>
        </button>

        <button type="button" class="icon-btn" id="btn-bookmarks" aria-label="Saved tutors">
          <span>&#9733;</span>
        </button>

        <div class="user-menu">
          <button type="button" class="user-menu-trigger" id="user-menu-trigger" aria-haspopup="true" aria-expanded="false">
            <span class="user-avatar" id="user-avatar"></span>
          </button>

          <div class="user-menu-dropdown" id="user-menu-dropdown" hidden>
            <div class="user-menu-identity">
              <span class="user-menu-dot" id="user-menu-dot"></span>
              <span class="user-menu-name-role" id="user-menu-name-role"></span>
            </div>
            <a href="login-signup.html" class="user-menu-item user-menu-signout" id="btn-signout">Signout</a>
          </div>
        </div>

      </div>
    </header>

    <main class="page-content">

      <div class="page-header">
        <h1>Find a Tutor</h1>
        <p class="page-subtitle">Browse verified peer tutors across CCS courses.</p>
      </div>

      <div class="filter-row">
        <select id="subject-filter" aria-label="Filter by subject">
          <option value="">All subjects</option>
        </select>
        <select id="sort-by" aria-label="Sort tutors">
          <option value="credibility">Sort: Highest Credibility</option>
          <option value="sessions">Sort: Most Sessions</option>
          <option value="name">Sort: Name (A-Z)</option>
        </select>
      </div>

      <div class="tutor-grid" id="tutor-results"></div>

    </main>

  </div>

  <script src="sidebar.js"></script>
  <script src="topbar.js"></script>
  <script src="find-tutor.js"></script>
</body>
</html>
